# Runs on every push and pull request (slice 10).
#
# What it can check: the 100+ tests that need only models/ - the input
# contract, the service over HTTP, the request log, the PSI arithmetic - and
# that the Docker image builds, which runs the same tests again inside it.
#
# What it cannot check: the train/serve skew test and the monitoring replay.
# They compare against data/processed, which is gitignored and is not here.
# Those tests skip and say why. They run on the machine that has the data.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # this runner is not the machine that wrote the data files: src/tolerance.py
      CRE_FLOAT_TOL: "1e-12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-service.txt
      - run: pip install -r requirements-service.txt
      - run: python -m pytest tests -q -rs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (its own tests run during the build)
        run: docker build -t credit-risk-engine .
      - name: Start it and ask for a decision
        run: |
          docker run -d --name cre -p 8000:8000 credit-risk-engine
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/example > example.json
          curl -sf -X POST localhost:8000/decision -H 'content-type: application/json' -d @example.json
          docker logs cre
